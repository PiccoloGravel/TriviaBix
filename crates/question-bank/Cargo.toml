[package]
name = "triviabix-questions"
version = "0.1.0"
edition = "2021"
description = "Question bank for TriviaBix: categories, question types, pack files, answer judging, and web importers"
license = "MIT"

[features]
default = []
# The command line tool (validate, stats, sample, export, import). Pulls in an
# HTTP client, so the game server should depend on the library without it.
cli = ["dep:clap", "dep:ureq", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }
base64 = { version = "0.22", optional = true }

[[bin]]
name = "triviabix-questions"
path = "src/main.rs"
required-features = ["cli"]

[package]
name = "triviabix"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3.34"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1.44"
triviabix-questions = { path = "../crates/question-bank" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

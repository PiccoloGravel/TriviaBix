# Everything generate.py makes, and the prompts that make it. See README.md.
#
# Each entry has an `id` (its file name) and a `prompt`. `seed` pins the result: change it to get a
# different take on the same prompt. Change a prompt or seed and only that file is made again.
#
#   backdrop  -> web/cutscenes/assets/gen/bg/<id>.webp        full-screen scene backgrounds
#   sticker   -> web/cutscenes/assets/gen/stickers/<id>.webp  cut-out props with a clear background
#   clip      -> web/cutscenes/assets/gen/clips/<id>.mp4      a backdrop brought to life, looping
#   category  -> web/cutscenes/assets/gen/category/<slug>.webp one title card per category in
#                content/categories.toml, made from the template below

[style]
# Part of every stored original's style, next to the model. Bump it when the art direction changes,
# so new art is made instead of old art being reused.
version = "bix-cartoon-v1"
# Goes in front of every prompt, so all the art looks like it belongs to one show (and to Bix).
prompt = """TriviaBix TV game show graphics. Bold flat vector cartoon, thick dark purple outlines, \
cel shading, saturated neon magenta, electric blue, sunny gold and deep purple palette, playful and \
cheeky, clean simple shapes, high contrast, readable from across a living room, no text"""
# Stickers get this after their prompt so the cut-out comes out clean.
sticker = "single object centered, isolated on a plain flat white background, chunky white sticker border, no shadow"
# Backdrops and category cards get this, so the middle stays calm enough to put text on.
backdrop = "wide shot, empty center with room for a big title, strong perspective, no people in front"

[category]
prompt = "{name} themed title card scene: {description} Iconic objects arranged around the edges, centered composition"
seed = 7


# ---------- Packs ----------
# Sets of pieces made for one part of the show. Pieces join one with `pack = "<id>"`. The prompts
# only say what's in the picture, never how it's drawn, so every theme redraws a pack in its own look.

[[pack]]
id = "minigames"
name = "Mini games"
emoji = "🎮"
description = "The bonus round between trivia rounds: its arena, the rules card and the winner's medal."

[[pack]]
id = "button-mash"
name = "Button Mash"
emoji = "🔴"
description = "Tap as fast as you can: giant arcade buttons, power meters and a blur of fingers."

[[pack]]

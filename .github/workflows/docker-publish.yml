name: Publish image

# Builds the server image, and Bix's voice service from tts/, and pushes them to GitHub Container
# Registry, so Unraid (or any Docker host) can pull ghcr.io/piccologravel/triviabix and
# ghcr.io/piccologravel/triviabix-tts instead of building from source.
#   main      -> :latest and :sha-<commit>
#   tag v1.2.3 -> :1.2.3, :1.2 and :latest
# Pull requests build the image to check the Dockerfile but don't push it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - tts/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: triviabix
            context: .
          - name: triviabix-tts
            context: tts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The voice image is PyTorch + CUDA, close to 10 GB; make room on the runner.
      - name: Free disk space
        if: matrix.name == 'triviabix-tts'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

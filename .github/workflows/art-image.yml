name: Publish art image

# Builds the art generator (art/Dockerfile) and pushes ghcr.io/piccologravel/triviabix-art, which
# art/render_on_vast.py runs on a rented GPU. Only rebuilt when the generator or categories change.

on:
  push:
    branches: [main]
    paths:
      - art/**
      - content/categories.toml
      - .github/workflows/art-image.yml
  pull_request:
    paths:
      - art/Dockerfile
      - art/requirements.txt
      - .github/workflows/art-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: art-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA base image is big; make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/triviabix-art
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: art/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

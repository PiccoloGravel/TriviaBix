<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TriviaBix · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-size: 16px; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 28px; color: var(--accent); flex: 1; }
    .stat { background: var(--panel); border-radius: 999px; padding: 6px 14px; color: var(--muted); }
    .stat b { color: var(--text); }
    button { padding: 8px 14px; font-size: 15px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
    button.danger { background: var(--bad); color: #fff; }
    button.small { padding: 4px 10px; font-size: 13px; box-shadow: none; }
    select { font: inherit; border-radius: 10px; border: none; padding: 6px 8px; background: #fff; color: #1a0b3d; }
    label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    a { color: var(--accent); }

    #login { max-width: 360px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    #login h1 { color: var(--accent); font-size: 36px; margin: 0; }

    .new-room { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 20px; }
    .new-room .title { font-family: "Bungee", sans-serif; }

    .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 0; grid-column: 1 / -1; }
    .room { background: var(--panel); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .room-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .room-code { font-family: "Bungee", sans-serif; font-size: 30px; color: var(--accent); letter-spacing: .06em; }
    .badge { border-radius: 999px; padding: 3px 10px; font-size: 13px; background: rgba(255,255,255,.12); }
    .badge.live { background: var(--good); color: #1a0b3d; }
    .badge.lobby { background: var(--accent); color: #1a0b3d; }
    .badge.off { background: var(--bad); color: #fff; }
    .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .question { background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .question .answer { color: var(--good); margin-top: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .settings { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--muted); font-weight: 700; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,.12); }
    td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
    td.score { text-align: right; font-family: "Bungee", sans-serif; }
    td.who { white-space: nowrap; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .teams { display: flex; flex-wrap: wrap; gap: 8px; }
    .team { border-radius: 999px; padding: 3px 12px; font-size: 13px; color: #1a0b3d; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bad); padding: 10px 18px; border-radius: 14px; z-index: 10; }
    @media (max-width: 440px) { .rooms { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="login" class="hidden" data-screen>
    <h1>TriviaBix</h1>
    <div class="muted">Organizer login</div>
    <form id="login-form" style="display:flex;flex-direction:column;gap:12px">
      <input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="error" id="login-error"></p>
  </section>

  <section id="dash" class="wrap hidden" data-screen>
    <header>
      <h1>TriviaBix Admin</h1>
      <span class="stat"><b id="stat-rooms">0</b> rooms</span>
      <span class="stat"><b id="stat-players">0</b> players</span>
      <button class="secondary" id="logout">Log out</button>
    </header>

    <form class="new-room" id="new-room">
      <span class="title">New room</span>
      <label class="inline">Rounds
        <select name="trivia_rounds"><option>3</option><option selected>4</option></select>
      </label>
      <label class="inline">Per round
        <select name="per_round"><option>3</option><option selected>5</option><option>7</option><option>10</option></select>
      </label>
      <label class="inline">Rated
        <select name="max_rating"><option>PG</option><option>PG-13</option><option>MA</option><option>NC-17</option></select>
      </label>
      <label class="inline">Teams
        <select name="teams"><option value="0">Off</option><option>2</option><option>3</option><option>4</option></select>
      </label>
      <label class="inline"><input type="checkbox" name="late_join" checked style="width:auto"> Late joins</label>
      <button type="submit">Create room</button>
    </form>

    <div class="rooms" id="rooms"></div>
  </section>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>

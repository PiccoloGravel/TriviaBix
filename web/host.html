<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriviaBix · TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/bix.css">
  <link rel="stylesheet" href="/cutscenes.css">
  <style>
    /* Sized in viewport units so it reads from the couch on any TV. */
    body { overflow: hidden; height: 100vh; font-size: 2.2vh; }
    .screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 4vh 5vw 15vh; display: flex; flex-direction: column; }

    #setup { align-items: center; justify-content: center; gap: 3vh; text-align: center; }
    #setup h1 { font-size: 13vh; margin: 0; color: var(--accent); text-shadow: 0 1vh 0 rgba(0,0,0,.35); }
    #setup p { font-size: 3vh; margin: 0; }

    .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 3vh; color: var(--muted); }
    .topbar .code-chip { color: var(--text); background: var(--panel); padding: .4vh 1.2vw; border-radius: 999px; }

    #lobby .main { flex: 1; display: grid; grid-template-columns: 40% 1fr; gap: 4vw; align-items: center; }
    .join-card { background: var(--panel); border-radius: 3vh; padding: 4vh 2vw; text-align: center; }
    .join-card .url { font-size: 3.4vh; word-break: break-all; }
    /* A tunnel's long address (triviabix.tail1234.ts.net) still fits on one line. */
    .join-card .url.long { font-size: 2.6vh; }
    .join-card .code { font-family: "Bungee", sans-serif; font-size: 17vh; line-height: 1; color: var(--accent); letter-spacing: .08em; margin: 1vh 0; }
    .join-card img { width: 22vh; height: 22vh; background: #fff; border-radius: 2vh; padding: 1vh; }
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vh 1.5vw; }
    .slot { background: var(--panel); border-radius: 2.5vh; padding: 2vh 1vw; text-align: center; min-height: 18vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; font-size: 3vh; }
    .slot.empty { border: .4vh dashed rgba(255,255,255,.2); background: none; color: rgba(255,255,255,.3); }
    .slot.away { opacity: .45; }
    .slot .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-tag { font-size: 1.8vh; }
    .team-strip { display: flex; justify-content: center; gap: 2vw; margin-bottom: 2.5vh; }
    .team-pill { display: flex; gap: 1.5vw; align-items: center; color: #1a0b3d; border-radius: 999px; padding: .8vh 2vw; font-size: 3.4vh; }
    .team-pill b { font-family: "Bungee", sans-serif; font-weight: 400; }
    .vip-tag { font-size: 1.8vh; background: var(--accent); color: #1a0b3d; padding: .2vh .8vw; border-radius: 999px; }
    .lobby-foot { text-align: center; font-size: 3.4vh; display: flex; justify-content: center; gap: 2vw; align-items: center; }

    #question .prompt, #reveal .prompt { font-size: 6vh; line-height: 1.2; text-align: center; margin: 3vh 0; flex: 0 0 auto; }
    .cat { text-align: center; font-size: 3vh; color: var(--accent); text-transform: uppercase; letter-spacing: .2em; }
    .choices { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vh 2vw; }
    .choice { border-radius: 3vh; padding: 2vh 2vw; display: flex; align-items: center; gap: 2vw; font-size: 4.8vh; position: relative; transition: opacity .3s, transform .3s; }
    .choice .shape { font-size: 6vh; opacity: .85; }
    .choice.dim { background: rgba(255,255,255,.06); }
    .choice.dim > span { opacity: .35; }
    .choice.right { outline: 1vh solid var(--good); transform: scale(1.03); }
    .choice .pickers { position: absolute; right: 1.5vw; bottom: 1.2vh; display: flex; gap: .5vw; }
    .timer { height: 2vh; margin: 2vh 0; }
    .answered-row { display: flex; gap: 1vw; justify-content: center; align-items: center; min-height: 7vh; font-size: 2.6vh; }
    .answered-row .avatar { transition: opacity .2s, transform .2s; }
    .answered-row .waiting { opacity: .25; transform: scale(.8); }
    .secs { font-family: "Bungee", sans-serif; font-size: 5vh; color: var(--accent); }

    #scoreboard h2, #final h2 { text-align: center; font-size: 7vh; margin: 1vh 0 3vh; color: var(--accent); }
    /* Big groups split into two columns, ranked top-to-bottom then left-to-right. */
    .board { --fs: min(4vh, calc(32vh / var(--rows, 8))); display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 8), auto); gap: calc(var(--fs) * .35) 2vw; max-width: 80vw; margin: 0 auto; width: 100%; }
    .row { display: flex; align-items: center; gap: 1.5vw; font-size: var(--fs); background: var(--panel); border-radius: 2vh; padding: calc(var(--fs) * .2) 1.5vw; }
    .row .rank { width: 4vw; color: var(--muted); }
    .row .name { flex: 1; }
    .row .gain { color: var(--good); font-size: .75em; }
    .row .score { font-family: "Bungee", sans-serif; }

    .podium { display: flex; justify-content: center; align-items: flex-end; gap: 3vw; flex: 1; }
    .step { width: 18vw; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .5vh; font-size: 4vh; }
    .step .block { width: 100%; border-radius: 2vh 2vh 0 0; background: var(--panel); display: flex; align-items: flex-start; justify-content: center; padding-top: 2vh; font-family: "Bungee", sans-serif; font-size: 7vh; }
    .rest { text-align: center; font-size: 3vh; margin-top: 3vh; color: var(--muted); }

    /* Name That Tune */
    .eq { display: flex; justify-content: center; align-items: flex-end; gap: 1vw; height: 14vh; margin: 1vh 0 3vh; }
    .eq span { width: 2.2vw; height: 20%; border-radius: 1vh; background: var(--accent); transition: height .2s; }
    .eq.playing span { animation: eq .5s ease-in-out infinite alternate; }
    .eq.playing span:nth-child(2) { animation-delay: -.15s; background: #2ec4b6; }
    .eq.playing span:nth-child(3) { animation-delay: -.3s; background: #ff4f81; }
    .eq.playing span:nth-child(4) { animation-delay: -.45s; background: #7b5cff; }
    .eq.playing span:nth-child(5) { animation-delay: -.2s; background: #3fa9f5; }
    @keyframes eq { from { height: 15%; } to { height: 100%; } }
    .listen { text-align: center; font-size: 3vh; color: var(--muted); min-height: 4vh; }
    .song-card { display: flex; align-items: center; justify-content: center; gap: 3vw; margin: 2vh 0 3vh; }
    .song-card img { width: 20vh; height: 20vh; border-radius: 2vh; object-fit: cover; box-shadow: 0 1vh 3vh rgba(0,0,0,.4); }
    .song-card .title { font-size: 6vh; line-height: 1.1; }
    .song-card .artist { font-size: 4vh; color: var(--accent); }
    .song-card .credit { font-size: 2vh; margin-top: 1vh; }
    .choice .song { display: flex; flex-direction: column; line-height: 1.15; }
    .choice .song small { font-size: .65em; opacity: .85; }
    /* Speed hangman */
    .secs.danger { color: var(--bad); animation: pulse .5s ease-in-out infinite alternate; }
    @keyframes pulse { to { transform: scale(1.25); } }
    .hm-main { flex: 1; display: grid; grid-template-columns: 24vw 1fr; gap: 3vw; align-items: center; min-height: 0; }
    #h-gallows { width: 100%; max-height: 46vh; }
    #h-gallows line, #h-gallows circle, #h-gallows path { stroke: var(--text); stroke-width: 4; stroke-linecap: round; fill: none; }
    #h-gallows .frame { stroke: var(--muted); }
    #h-gallows .part { opacity: 0; transition: opacity .2s; }
    #h-gallows .part.on { opacity: 1; }
    #h-gallows.dead .part { stroke: var(--bad); }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-1.5vw); } 40%, 80% { transform: translateX(1.5vw); } }
    .hm-right { display: flex; flex-direction: column; align-items: center; gap: 3vh; }
    .hm-board { --tile: 9vh; display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--tile) * .25) calc(var(--tile) * .6); }
    .hm-board.long { --tile: 7vh; }
    .hm-word { display: flex; gap: calc(var(--tile) * .12); }
    .tile { width: calc(var(--tile) * .8); height: var(--tile); display: flex; align-items: center; justify-content: center; font-family: "Bungee", sans-serif; font-size: calc(var(--tile) * .62); background: var(--text); color: var(--bg); border-radius: 1vh; }
    .tile.blank { background: var(--panel); border-bottom: .6vh solid var(--accent); }
    .tile.punct { background: none; color: var(--text); width: auto; }
    .tile.missed { background: var(--bad); color: var(--text); }
    .tile.solved { background: var(--good); }
    .hm-banner { font-family: "Bungee", sans-serif; font-size: 6vh; min-height: 7vh; text-align: center; }
    .hm-banner.solved { color: var(--good); }
    .hm-banner.hanged, .hm-banner.time { color: var(--bad); }
    .hm-letters { display: flex; justify-content: center; gap: .4vw; margin-top: 2vh; }
    .hm-letters span { flex: 1; max-width: 3.2vw; text-align: center; font-family: "Bungee", sans-serif; font-size: 3.2vh; padding: .4vh 0; border-radius: .8vh; background: var(--panel); }
    .hm-letters .hit { background: var(--good); color: var(--bg); }
    .hm-letters .miss { background: var(--bad); text-decoration: line-through; }
    .hm-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; height: 18vh; }
    .hm-feed { display: flex; flex-direction: column; gap: .6vh; overflow: hidden; font-size: 2.6vh; }
    .hm-feed div { display: flex; align-items: center; gap: .8vw; }
    .hm-feed .good { color: var(--good); }
    .hm-feed .bad { color: var(--bad); }
    .hm-feed .win { color: var(--accent); }
    .hm-scores { display: flex; flex-wrap: wrap; gap: 1vh 1.5vw; align-content: flex-start; justify-content: flex-end; font-size: 2.6vh; }
    .hm-scores div { display: flex; align-items: center; gap: .5vw; background: var(--panel); padding: .4vh 1vw .4vh .4vw; border-radius: 999px; }

    .corner { position: fixed; right: 1.5vw; bottom: 1.5vh; display: flex; gap: 1vw; z-index: 5; }
    .corner button { font-size: 2vh; padding: .6vh 1vw; }
    .now-playing { position: fixed; left: 1.5vw; bottom: 1.5vh; z-index: 5; font-size: 2vh; color: var(--muted); background: rgba(0,0,0,.35); border-radius: 999px; padding: .6vh 1.2vw; max-width: 45vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Above the buttons and clear of Bix's bubble (which stops at 78vw), so neither hides it. */
    .sound-hint { position: fixed; right: 1.5vw; bottom: 7.5vh; max-width: 19vw; text-align: center; font-size: 2vh; background: var(--accent); color: #1a0b3d; border-radius: 1vh; padding: .6vh 1vw; }
    .banner { position: fixed; top: 0; left: 0; right: 0; text-align: center; background: var(--bad); padding: 1vh; font-size: 2.6vh; z-index: 10; }
    /* ---------- Game show graphics ---------- */

    /* The host: a mic avatar and a speech bubble along the bottom of every screen. */
    .host-bar { position: fixed; left: 2vw; bottom: 2vh; right: 22vw; display: flex; align-items: flex-end; gap: 1.2vw; z-index: 6; pointer-events: none; transition: opacity .4s, transform .4s; }
    .host-bar.quiet { opacity: 0; transform: translateY(4vh); }
    /* Hidden from the admin panel: no Bix at all, or Bix without his words. */
    .host-bar.off { display: none; }
    .host-bar.no-words .host-bubble { display: none; }
    /* Bix himself (bix.js): his face follows the moment, and his mouth moves while the voice talks. */
    .host-face { flex: 0 0 auto; width: 15vh; position: relative; filter: drop-shadow(0 .8vh 0 rgba(0,0,0,.35)); }
    .host-face::after { content: attr(data-name); position: absolute; bottom: -1vh; left: 50%; transform: translateX(-50%); font-family: "Bungee", sans-serif; font-size: 1.8vh; background: var(--c0); color: #fff; padding: .1vh .8vw; border-radius: 999px; white-space: nowrap; }
    .host-bar.react .host-face { animation: pop-in .4s cubic-bezier(.2,1.6,.4,1); }
    .host-bubble { background: #fff8f0; color: #1a0b3d; font-size: 3vh; line-height: 1.3; padding: 1.4vh 1.6vw; border-radius: 2.5vh 2.5vh 2.5vh .5vh; max-height: 12vh; overflow: hidden; box-shadow: 0 .8vh 0 rgba(0,0,0,.35); }
    .host-bubble.fresh { animation: pop-in .35s cubic-bezier(.2,1.6,.4,1); }
    /* A character cameo: Bix wears the character's emoji as a costume and his name tag says who he's playing. */
    .host-costume { position: absolute; top: -5vh; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: 8vh; line-height: 1; z-index: 2; opacity: 0; transition: opacity .2s; }
    .host-bar.cameo .host-costume { opacity: 1; animation: costume-on .45s cubic-bezier(.2,1.6,.4,1); }
    @keyframes costume-on { from { transform: translateX(-50%) translateY(-4vh) rotate(-30deg) scale(.4); opacity: 0; } to { transform: translateX(-50%) rotate(-8deg) scale(1); opacity: 1; } }
    .host-say { position: relative; min-width: 0; }
    .host-as { display: none; position: absolute; bottom: calc(100% - .6vh); left: 1.2vw; z-index: 1; font-family: "Bungee", sans-serif; font-size: 1.9vh; background: #ff3d7f; color: #fff; padding: .3vh .9vw; border-radius: 999px; white-space: nowrap; transform: rotate(-2deg); }
    .host-bar.cameo .host-as { display: block; animation: pop-in .35s cubic-bezier(.2,1.6,.4,1); }
    .host-bar.no-words .host-as { display: none; }
    .host-bar.cameo .host-bubble { background: #fff2c2; }
    @keyframes pop-in { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Callouts: stamps and banners that pop with the host's reactions. */
    .callouts { position: fixed; bottom: 9vh; right: 3vw; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 2vh; z-index: 7; pointer-events: none; }
    .callouts.top { bottom: auto; top: 14vh; flex-direction: column; }
    .callout { display: flex; align-items: center; gap: 1vw; padding: 1.2vh 2vw; border-radius: 2vh; font-family: "Bungee", sans-serif; font-size: 4.4vh; color: #fff; box-shadow: 0 1vh 0 rgba(0,0,0,.35); animation: slam .5s cubic-bezier(.2,1.6,.4,1) both, fade-out .5s ease-in forwards; animation-delay: var(--in, 0s), var(--out, 3s); }
    .callout .who { font-family: "Nunito", sans-serif; font-weight: 900; font-size: 2.6vh; display: block; opacity: .9; }
    .callout .icon { font-size: 6vh; }
    .callout.roast { background: var(--bad); transform: rotate(-6deg); border: .5vh dashed #fff; animation-name: stamp, fade-out; }
    .callout.streak { background: linear-gradient(90deg, #ff3d00, #ffb400); }
    .callout.streak .icon { animation: flicker .3s infinite alternate; }
    .callout.streak_broken, .callout.asleep, .callout.last_place, .callout.nobody { background: #4b3a7a; }
    .callout.fastest, .callout.only_one { background: var(--c1); }
    .callout.everyone { background: var(--good); color: #1a0b3d; }
    .callout.new_leader, .callout.leader, .callout.winner, .callout.tie { background: var(--accent); color: #1a0b3d; }
    @keyframes slam { from { transform: translateX(60vw) skewX(-20deg); } 70% { transform: translateX(-2vw) skewX(5deg); } to { transform: none; } }
    @keyframes stamp { from { transform: scale(3) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(-6deg); opacity: 1; } to { transform: scale(1) rotate(-6deg); } }
    @keyframes fade-out { to { opacity: 0; transform: translateY(-3vh); } }
    @keyframes flicker { from { transform: scale(1) rotate(-5deg); } to { transform: scale(1.15) rotate(5deg); } }

    /* Question and reveal motion. */
    .enter .prompt { animation: rise .6s .9s cubic-bezier(.2,1.2,.4,1) both; }
    .enter .choice { animation: pop-in .4s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(1.2s + var(--i) * 120ms); }
    @keyframes rise { from { transform: translateY(6vh); opacity: 0; } to { transform: none; opacity: 1; } }
    .hurry .secs { color: var(--bad); animation: throb .5s ease-in-out infinite alternate; }
    .hurry .timer-fill { background: var(--bad); }
    @keyframes throb { to { transform: scale(1.35); } }
    #reveal.enter .choice.dim { animation: shake .45s ease-in-out both; }
    #reveal.enter .choice.right { animation: glow 1.2s ease-in-out .2s 2 alternate; }
    @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-1.2vw); } 75% { transform: translateX(1.2vw); } }
    @keyframes glow { from { box-shadow: 0 0 0 rgba(46,229,157,0); } to { box-shadow: 0 0 6vh rgba(46,229,157,.9); transform: scale(1.06); } }
    .float-pts { position: absolute; top: -3vh; right: 1vw; font-family: "Bungee", sans-serif; color: var(--good); font-size: 3.5vh; animation: float-up 1.8s ease-out .6s both; }
    @keyframes float-up { from { transform: translateY(2vh); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-5vh); opacity: 0; } }

    /* Intro: logo slam, spotlights, contestants fly in. */
    #intro { align-items: center; justify-content: center; gap: 5vh; overflow: hidden; }
    #intro .logo { font-family: "Bungee", sans-serif; font-size: 18vh; color: var(--accent); text-shadow: 0 1.5vh 0 rgba(0,0,0,.35); animation: logo-slam .9s cubic-bezier(.2,1.6,.4,1) both; z-index: 1; }
    #intro .tagline { font-size: 3.4vh; color: var(--muted); letter-spacing: .3em; text-transform: uppercase; animation: rise .6s .7s both; z-index: 1; }
    #intro .lineup { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; max-width: 85vw; z-index: 1; }
    #intro .lineup > div { display: flex; flex-direction: column; align-items: center; gap: 1vh; font-size: 2.8vh; animation: fly-in .6s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(1s + var(--i) * 150ms); }
    .spot { position: absolute; top: -20vh; width: 30vw; height: 140vh; background: linear-gradient(rgba(255,255,255,.18), transparent 80%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); transform-origin: top center; animation: swing 4s ease-in-out infinite alternate; }
    .spot.l { left: 5vw; } .spot.r { right: 5vw; animation-delay: -2s; }
    @keyframes logo-slam { from { transform: scale(4) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fly-in { from { transform: translateY(40vh) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes swing { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }

    /* Scoreboard rows slide from their old place to their new one. */
    .board .row { transition: transform .9s cubic-bezier(.2,1,.3,1); }
    .row.up { box-shadow: 0 0 0 .4vh var(--good); }
    .row.down { opacity: .85; }
    .crown { position: absolute; top: -6vh; left: 50%; transform: translateX(-50%); font-size: 7vh; animation: logo-slam .8s 1s both; }
    .step { position: relative; }
    #confetti { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 9; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }

    /* Trivia rounds: title cards, the difficulty ladder and the recap between rounds. */
    .diff-easy { --diff: var(--good); }
    .diff-medium { --diff: var(--accent); }
    .diff-hard { --diff: #ff7a00; }
    .diff-final { --diff: var(--bad); }
    #round_intro { align-items: center; justify-content: center; gap: 3vh; }
    .ri-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-align: center; }
    .ri-title { font-family: "Bungee", sans-serif; font-size: 8vh; color: var(--diff); letter-spacing: .1em; }
    .ri-cat { font-family: "Bungee", sans-serif; font-size: 13vh; line-height: 1.05; max-width: 90vw; text-shadow: 0 1.2vh 0 rgba(0,0,0,.35); }
    .ri-tags { display: flex; gap: 2vw; font-size: 4vh; align-items: center; }
    .ri-tags .pill { background: var(--diff); color: #1a0b3d; border-radius: 999px; padding: .6vh 2vw; font-family: "Bungee", sans-serif; }
    .ri-tags .pill.mult { background: var(--text); }
    #round_intro.enter .ri-title { animation: rise .5s .1s both; }
    #round_intro.enter .ri-cat { animation: logo-slam .8s .4s cubic-bezier(.2,1.6,.4,1) both; }
    #round_intro.enter .ri-tags { animation: rise .5s 1.1s both; }
    /* The category's generated title card (art/generate.py), faded behind the round's title. */
    #round_intro.has-art, #minigame.has-art { isolation: isolate; overflow: hidden; }
    #round_intro.has-art::before, #minigame.has-art::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; background: linear-gradient(rgba(13,6,32,.55), rgba(13,6,32,.85)), var(--cat-art) center / cover; animation: ri-art 12s ease-out both; }
    @keyframes ri-art { from { transform: scale(1.12); opacity: 0; } 15% { opacity: 1; } to { transform: scale(1); } }
    .ladder { display: flex; justify-content: center; align-items: flex-end; gap: 1.2vw; width: 100%; }
    .rung { flex: 0 1 18vw; background: var(--panel); border-radius: 2vh 2vh 1vh 1vh; padding: 1.2vh 1vw; text-align: center; border-top: .8vh solid var(--diff); min-height: calc(12vh + var(--i) * 3vh); display: flex; flex-direction: column; justify-content: flex-end; gap: .3vh; transition: transform .3s; }
    .rung-title { font-family: "Bungee", sans-serif; font-size: 2.4vh; color: var(--diff); }
    .rung-cat { font-size: 2.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rung-diff { font-size: 2vh; color: var(--muted); }
    .rung.next { opacity: .5; }
    .rung.done { opacity: .75; }
    .rung.done .rung-title::after { content: " ✓"; color: var(--good); }
    .rung.current { background: rgba(255,255,255,.18); transform: translateY(-1.5vh) scale(1.06); box-shadow: 0 0 4vh var(--diff); box-shadow: 0 0 4vh color-mix(in srgb, var(--diff) 60%, transparent); }
    .ladder.small { align-items: stretch; margin-bottom: 2.5vh; }
    .ladder.small .rung { min-height: 0; padding: .6vh .8vw; border-radius: 1.5vh; }
    .ladder.small .rung.current { transform: scale(1.04); }
    .ladder.small .rung-cat { font-size: 2vh; }
    #recap h2 { text-align: center; font-size: 6vh; margin: .5vh 0 2vh; color: var(--accent); }
    .recap-main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; min-height: 0; align-items: start; }
    .recap-main .board { max-width: none; }
    .recap-qs { display: flex; flex-direction: column; gap: 1vh; overflow: hidden; }
    .rq { display: flex; align-items: center; gap: 1vw; background: var(--panel); border-radius: 2vh; padding: .8vh 1vw; font-size: 2.3vh; }
    .rq-n { font-family: "Bungee", sans-serif; font-size: 3vh; color: var(--accent); width: 3vw; text-align: center; flex: 0 0 auto; }
    .rq-text { flex: 1; min-width: 0; }
    .rq-prompt { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rq-answer { font-size: 2.8vh; color: var(--good); }
    .rq-who { display: flex; gap: .3vw; flex-wrap: wrap; justify-content: flex-end; max-width: 14vw; font-size: 2vh; }
    #recap.enter .rq { animation: rise .5s both; animation-delay: calc(.4s + var(--i) * 150ms); }
    .callout.round_winner { background: linear-gradient(90deg, var(--c0), var(--accent)); color: #1a0b3d; }
    /* Mini games between trivia rounds. */
    #minigame { align-items: center; }
    .mg-head { text-align: center; margin-top: 1vh; }
    .mg-tag { display: inline-block; font-family: "Bungee", sans-serif; font-size: 2.6vh; background: var(--accent); color: #1a0b3d; border-radius: 999px; padding: .4vh 1.6vw; letter-spacing: .1em; }
    #mg-title { font-family: "Bungee", sans-serif; font-weight: 400; font-size: 9vh; margin: 1vh 0 0; line-height: 1; text-shadow: 0 1vh 0 rgba(0,0,0,.35); }
    .mg-rules { font-size: 3.4vh; color: var(--muted); margin-top: 1.5vh; max-width: 70vw; }
    .mg-big { font-family: "Bungee", sans-serif; font-size: 7vh; text-align: center; margin: 2vh 0 1vh; min-height: 9vh; max-width: 85vw; line-height: 1.15; }
    .mg-big.prompt { font-family: inherit; font-weight: 900; font-size: 5.4vh; }
    .mg-big.wait { color: var(--bad); font-size: 14vh; animation: mg-pulse 1s infinite; }
    .mg-big.go { color: var(--good); font-size: 18vh; animation: logo-slam .5s cubic-bezier(.2,1.6,.4,1) both; }
    .mg-big.answer { color: var(--good); }
    .mg-big.clock { font-size: 16vh; font-variant-numeric: tabular-nums; }
    .mg-big.hidden-clock { color: var(--muted); }
    @keyframes mg-pulse { 50% { opacity: .55; } }
    #minigame .timer { width: 80vw; }
    .mg-rows { width: 80vw; display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); gap: 1vh 2vw; }
    .mg-row { display: flex; align-items: center; gap: 1.2vw; background: var(--panel); border-radius: 2vh; padding: .7vh 1.2vw; font-size: 3vh; position: relative; overflow: hidden; }
    .mg-row .mg-bar { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(255,255,255,.12); transition: width .3s; z-index: 0; }
    .mg-row > *:not(.mg-bar) { position: relative; z-index: 1; }
    .mg-row .mg-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mg-row .mg-val { font-family: "Bungee", sans-serif; }
    .mg-row .mg-pts { font-family: "Bungee", sans-serif; color: var(--good); min-width: 6vw; text-align: right; }
    .mg-row.out { opacity: .5; }
    .mg-row.out .mg-val { color: var(--bad); }
    .mg-row.first { outline: .5vh solid var(--accent); }
    /* Rows are redrawn on every tap, so only a new step animates them in. */
    .mg-row.fresh { animation: rise .4s both; animation-delay: calc(.2s + var(--i) * 90ms); }
    #minigame.enter #mg-title { animation: logo-slam .8s .1s cubic-bezier(.2,1.6,.4,1) both; }
    /* Stickers from the game's art pack on either side of the title (none until art is made). */
    .mg-sticker { position: absolute; top: 12vh; width: 22vh; height: 22vh; object-fit: contain; filter: drop-shadow(0 1vh 1.5vh rgba(0,0,0,.45)); animation: mg-bob 3s ease-in-out infinite; pointer-events: none; }
    .mg-sticker.left { left: 5vw; transform: rotate(-10deg); }
    .mg-sticker.right { right: 5vw; transform: rotate(10deg); animation-delay: -1.5s; }
    @keyframes mg-bob { 50% { margin-top: -1.5vh; } }
    #minigame.enter .mg-sticker { animation: logo-slam .7s .4s cubic-bezier(.2,1.6,.4,1) both, mg-bob 3s 1.1s ease-in-out infinite; }
    .callout.mini_winner { background: linear-gradient(90deg, var(--good), var(--accent)); color: #1a0b3d; }
    .toast { position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%); background: var(--bad); padding: 1.2vh 2vw; border-radius: 2vh; font-size: 2.6vh; z-index: 10; }
    .toast.info { background: var(--accent); color: #1a0b3d; }
  </style>
</head>
<body>
  <div id="offline" class="banner hidden">Reconnecting to the server…</div>
  <div id="toast" class="toast hidden"></div>

  <section id="setup" class="screen hidden" data-screen>
    <h1>TriviaBix</h1>
    <p class="muted">Opening a room…</p>
    <p class="error" id="setup-error"></p>
  </section>

  <section id="lobby" class="screen hidden" data-screen>
    <div class="topbar"><span class="display">TriviaBix</span><span id="lobby-settings"></span></div>
    <div class="main">
      <div class="join-card">
        <div class="url">Join at <b id="join-url"></b></div>
        <div class="code" id="room-code">----</div>
        <img id="qr" alt="QR code to join">
      </div>
      <div>
        <div class="slots" id="slots"></div>
      </div>
    </div>
    <div class="lobby-foot">
      <span id="lobby-hint"></span>
    </div>
  </section>

  <section id="intro" class="screen hidden" data-screen>
    <div class="spot l"></div><div class="spot r"></div>
    <div class="logo">TriviaBix</div>
    <div class="tagline" id="i-tagline"></div>
    <div class="lineup" id="i-lineup"></div>
  </section>

  <section id="round_intro" class="screen hidden" data-screen>
    <div class="topbar" style="align-self:stretch"><span id="ri-count"></span><span></span><span class="code-chip" id="ri-code"></span></div>
    <div class="ri-main">
      <div class="ri-title" id="ri-title"></div>
      <div class="ri-cat" id="ri-cat"></div>
      <div class="ri-tags"><span class="pill" id="ri-diff"></span><span class="pill mult" id="ri-mult"></span><span class="muted" id="ri-qs"></span></div>
    </div>
    <div class="ladder" id="ri-ladder"></div>
  </section>
  <section id="question" class="screen hidden" data-screen>
    <div class="topbar"><span id="q-round"></span><span class="secs" id="q-secs"></span><span class="code-chip" id="q-code"></span></div>
    <div class="cat" id="q-cat"></div>
    <div class="prompt" id="q-prompt"></div>
    <div class="eq hidden" id="q-eq"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="listen hidden" id="q-listen"></div>
    <div class="choices" id="q-choices"></div>
    <div class="timer"><div class="timer-track"><div class="timer-fill" id="q-timer"></div></div></div>
    <div class="answered-row" id="q-answered"></div>
  </section>

  <section id="reveal" class="screen hidden" data-screen>
    <div class="topbar"><span id="r-round"></span><span></span><span class="code-chip" id="r-code"></span></div>
    <div class="cat" id="r-cat"></div>
    <div class="prompt" id="r-prompt"></div>
    <div class="song-card hidden" id="r-song">
      <img id="r-art" alt="">
      <div>
        <div class="title" id="r-title"></div>
        <div class="artist" id="r-artist"></div>
        <div class="muted credit" id="r-credit">Song preview courtesy of Apple Music</div>
      </div>
    </div>
    <div class="choices" id="r-choices"></div>
    <div class="timer"><div class="timer-track"><div class="timer-fill" id="r-timer"></div></div></div>
  </section>

  <section id="hangman" class="screen hidden" data-screen>
    <div class="topbar"><span id="h-round"></span><span class="secs" id="h-secs"></span><span class="code-chip" id="h-code"></span></div>
    <div class="cat" id="h-cat"></div>
    <div class="hm-main">
      <svg id="h-gallows" viewBox="0 0 120 160" aria-label="Strikes">
        <path class="frame" d="M10 152 H80 M30 152 V8 H84 V24 M30 34 L52 8"/>
        <circle class="part" cx="84" cy="36" r="12"/>
        <line class="part" x1="84" y1="48" x2="84" y2="94"/>
        <line class="part" x1="84" y1="58" x2="66" y2="78"/>
        <line class="part" x1="84" y1="58" x2="102" y2="78"/>
        <line class="part" x1="84" y1="94" x2="70" y2="124"/>
        <line class="part" x1="84" y1="94" x2="98" y2="124"/>
      </svg>
      <div class="hm-right">
        <div class="hm-board" id="h-board"></div>
        <div class="hm-banner" id="h-banner"></div>
      </div>
    </div>
    <div class="hm-letters" id="h-letters"></div>
    <div class="timer"><div class="timer-track"><div class="timer-fill" id="h-timer"></div></div></div>
    <div class="hm-bottom">
      <div class="hm-feed" id="h-feed"></div>
      <div class="hm-scores" id="h-scores"></div>
    </div>
  </section>

  <section id="scoreboard" class="screen hidden" data-screen>
    <div class="topbar"><span id="s-round"></span><span></span><span class="code-chip" id="s-code"></span></div>
    <h2>Scores</h2>
    <div class="team-strip" id="s-teams"></div>
    <div class="board" id="s-board"></div>
  </section>

  <section id="recap" class="screen hidden" data-screen>
    <div class="topbar"><span id="rc-round"></span><span></span><span class="code-chip" id="rc-code"></span></div>
    <h2 id="rc-title"></h2>
    <div class="ladder small" id="rc-ladder"></div>
    <div class="team-strip" id="rc-teams"></div>
    <div class="recap-main">
      <div class="board" id="rc-board"></div>
      <div class="recap-qs" id="rc-qs"></div>
    </div>
  </section>
  <section id="minigame" class="screen hidden" data-screen>
    <div class="topbar" style="width:100%"><span id="mg-round"></span><span class="secs" id="mg-secs"></span><span class="code-chip" id="mg-code"></span></div>
    <div class="mg-head">
      <div class="mg-tag">Mini game</div>
      <h2 id="mg-title"></h2>
      <div class="mg-rules" id="mg-rules"></div>
    </div>
    <img class="mg-sticker left hidden" id="mg-st-a" alt="">
    <img class="mg-sticker right hidden" id="mg-st-b" alt="">
    <div class="mg-big" id="mg-big"></div>
    <div class="timer"><div class="timer-track"><div class="timer-fill" id="mg-timer"></div></div></div>
    <div class="mg-rows" id="mg-rows"></div>
  </section>
  <section id="final" class="screen hidden" data-screen>
    <h2 id="f-title">Winner!</h2>
    <div class="team-strip" id="f-teams"></div>
    <div class="podium" id="f-podium"></div>
    <div class="rest" id="f-rest"></div>
    <div class="lobby-foot" style="margin-top:3vh">
      <span class="muted">The VIP can pick the next game from their phone.</span>
    </div>
  </section>

  <div class="host-bar quiet" id="host-bar">
    <div class="host-face" id="host-face" data-name="Bix"><div class="host-costume" id="host-costume"></div></div>
    <div class="host-say"><div class="host-as" id="host-as"></div><div class="host-bubble" id="host-bubble"></div></div>
  </div>
  <div class="callouts" id="callouts"></div>
  <canvas id="confetti"></canvas>

  <div class="now-playing hidden" id="now-playing"></div>
  <div class="corner">
    <span class="sound-hint hidden" id="sound-hint">🔈 Click this screen once to turn on sound</span>
    <button class="secondary hidden" id="sound-btn">🔈 Tap for sound</button>
    <button class="secondary" id="music-btn" title="B">🎵 Music</button>
    <button class="secondary" id="mute-btn" title="M">🔊 Host voice</button>
    <button class="secondary" id="voice-btn" title="V">🗣 Voice</button>
    <button class="secondary" id="fs-btn" title="F">⛶ Fullscreen</button>
  </div>

  <script src="/common.js"></script>
  <script src="/bix.js"></script>
  <script src="/cutscenes.js"></script>
  <script src="/sfx.js"></script>
  <script src="/host.js"></script>
</body>
</html>

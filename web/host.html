<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriviaBix · TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Sized in viewport units so it reads from the couch on any TV. */
    body { overflow: hidden; height: 100vh; font-size: 2.2vh; }
    .screen { position: absolute; inset: 0; padding: 4vh 5vw 15vh; display: flex; flex-direction: column; }

    #setup { align-items: center; justify-content: center; gap: 3vh; text-align: center; }
    #setup h1 { font-size: 13vh; margin: 0; color: var(--accent); text-shadow: 0 1vh 0 rgba(0,0,0,.35); }
    #setup p { font-size: 3vh; margin: 0; }
    .opts { display: flex; gap: 2vw; font-size: 3vh; align-items: center; }
    .opts button { font-size: 3vh; }
    #create { font-size: 5vh; padding: 2vh 5vw; }

    .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 3vh; color: var(--muted); }
    .topbar .code-chip { color: var(--text); background: var(--panel); padding: .4vh 1.2vw; border-radius: 999px; }

    #lobby .main { flex: 1; display: grid; grid-template-columns: 40% 1fr; gap: 4vw; align-items: center; }
    .join-card { background: var(--panel); border-radius: 3vh; padding: 4vh 2vw; text-align: center; }
    .join-card .url { font-size: 3.4vh; word-break: break-all; }
    .join-card .code { font-family: "Bungee", sans-serif; font-size: 17vh; line-height: 1; color: var(--accent); letter-spacing: .08em; margin: 1vh 0; }
    .join-card img { width: 22vh; height: 22vh; background: #fff; border-radius: 2vh; padding: 1vh; }
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vh 1.5vw; }
    .slot { background: var(--panel); border-radius: 2.5vh; padding: 2vh 1vw; text-align: center; min-height: 18vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; font-size: 3vh; }
    .slot.empty { border: .4vh dashed rgba(255,255,255,.2); background: none; color: rgba(255,255,255,.3); }
    .slot.away { opacity: .45; }
    .slot .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vip-tag { font-size: 1.8vh; background: var(--accent); color: #1a0b3d; padding: .2vh .8vw; border-radius: 999px; }
    .lobby-foot { text-align: center; font-size: 3.4vh; display: flex; justify-content: center; gap: 2vw; align-items: center; }
    .lobby-foot button { font-size: 3.4vh; }

    #question .prompt, #reveal .prompt { font-size: 6vh; line-height: 1.2; text-align: center; margin: 3vh 0; flex: 0 0 auto; }
    .cat { text-align: center; font-size: 3vh; color: var(--accent); text-transform: uppercase; letter-spacing: .2em; }
    .choices { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vh 2vw; }
    .choice { border-radius: 3vh; padding: 2vh 2vw; display: flex; align-items: center; gap: 2vw; font-size: 4.8vh; position: relative; transition: opacity .3s, transform .3s; }
    .choice .shape { font-size: 6vh; opacity: .85; }
    .choice.dim { background: rgba(255,255,255,.06); }
    .choice.dim > span { opacity: .35; }
    .choice.right { outline: 1vh solid var(--good); transform: scale(1.03); }
    .choice .pickers { position: absolute; right: 1.5vw; bottom: 1.2vh; display: flex; gap: .5vw; }
    .timer { height: 2vh; margin: 2vh 0; }
    .answered-row { display: flex; gap: 1vw; justify-content: center; align-items: center; min-height: 7vh; font-size: 2.6vh; }
    .answered-row .avatar { transition: opacity .2s, transform .2s; }
    .answered-row .waiting { opacity: .25; transform: scale(.8); }
    .secs { font-family: "Bungee", sans-serif; font-size: 5vh; color: var(--accent); }

    #scoreboard h2, #final h2 { text-align: center; font-size: 7vh; margin: 1vh 0 3vh; color: var(--accent); }
    /* Big groups split into two columns, ranked top-to-bottom then left-to-right. */
    .board { --fs: min(4vh, calc(32vh / var(--rows, 8))); display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 8), auto); gap: calc(var(--fs) * .35) 2vw; max-width: 80vw; margin: 0 auto; width: 100%; }
    .row { display: flex; align-items: center; gap: 1.5vw; font-size: var(--fs); background: var(--panel); border-radius: 2vh; padding: calc(var(--fs) * .2) 1.5vw; }
    .row .rank { width: 4vw; color: var(--muted); }
    .row .name { flex: 1; }
    .row .gain { color: var(--good); font-size: .75em; }
    .row .score { font-family: "Bungee", sans-serif; }

    .podium { display: flex; justify-content: center; align-items: flex-end; gap: 3vw; flex: 1; }
    .step { width: 18vw; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .5vh; font-size: 4vh; }
    .step .block { width: 100%; border-radius: 2vh 2vh 0 0; background: var(--panel); display: flex; align-items: flex-start; justify-content: center; padding-top: 2vh; font-family: "Bungee", sans-serif; font-size: 7vh; }
    .rest { text-align: center; font-size: 3vh; margin-top: 3vh; color: var(--muted); }

    .corner { position: fixed; right: 1.5vw; bottom: 1.5vh; display: flex; gap: 1vw; z-index: 5; }
    .corner button { font-size: 2vh; padding: .6vh 1vw; }
    .banner { position: fixed; top: 0; left: 0; right: 0; text-align: center; background: var(--bad); padding: 1vh; font-size: 2.6vh; z-index: 10; }
    /* ---------- Game show graphics ---------- */

    /* The host: a mic avatar and a speech bubble along the bottom of every screen. */
    .host-bar { position: fixed; left: 2vw; bottom: 2vh; right: 22vw; display: flex; align-items: flex-end; gap: 1.2vw; z-index: 6; pointer-events: none; transition: opacity .4s, transform .4s; }
    .host-bar.quiet { opacity: 0; transform: translateY(4vh); }
    .host-face { flex: 0 0 auto; width: 10vh; height: 10vh; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--accent) 45%, #e08a00); display: flex; align-items: center; justify-content: center; font-size: 5.5vh; box-shadow: 0 .8vh 0 rgba(0,0,0,.35); position: relative; }
    .host-face::after { content: attr(data-name); position: absolute; bottom: -1.4vh; left: 50%; transform: translateX(-50%); font-family: "Bungee", sans-serif; font-size: 1.8vh; background: var(--c0); color: #fff; padding: .1vh .8vw; border-radius: 999px; white-space: nowrap; }
    .host-bar.talking .host-face { animation: bob .35s ease-in-out infinite alternate; }
    .host-bubble { background: #fff8f0; color: #1a0b3d; font-size: 3vh; line-height: 1.3; padding: 1.4vh 1.6vw; border-radius: 2.5vh 2.5vh 2.5vh .5vh; max-height: 12vh; overflow: hidden; box-shadow: 0 .8vh 0 rgba(0,0,0,.35); }
    .host-bubble.fresh { animation: pop-in .35s cubic-bezier(.2,1.6,.4,1); }
    @keyframes bob { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-.8vh) rotate(4deg); } }
    @keyframes pop-in { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Callouts: stamps and banners that pop with the host's reactions. */
    .callouts { position: fixed; bottom: 9vh; right: 3vw; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 2vh; z-index: 7; pointer-events: none; }
    .callouts.top { bottom: auto; top: 14vh; flex-direction: column; }
    .callout { display: flex; align-items: center; gap: 1vw; padding: 1.2vh 2vw; border-radius: 2vh; font-family: "Bungee", sans-serif; font-size: 4.4vh; color: #fff; box-shadow: 0 1vh 0 rgba(0,0,0,.35); animation: slam .5s cubic-bezier(.2,1.6,.4,1) both, fade-out .5s ease-in forwards; animation-delay: var(--in, 0s), var(--out, 3s); }
    .callout .who { font-family: "Nunito", sans-serif; font-weight: 900; font-size: 2.6vh; display: block; opacity: .9; }
    .callout .icon { font-size: 6vh; }
    .callout.roast { background: var(--bad); transform: rotate(-6deg); border: .5vh dashed #fff; animation-name: stamp, fade-out; }
    .callout.streak { background: linear-gradient(90deg, #ff3d00, #ffb400); }
    .callout.streak .icon { animation: flicker .3s infinite alternate; }
    .callout.streak_broken, .callout.asleep, .callout.last_place, .callout.nobody { background: #4b3a7a; }
    .callout.fastest, .callout.only_one { background: var(--c1); }
    .callout.everyone { background: var(--good); color: #1a0b3d; }
    .callout.new_leader, .callout.leader, .callout.winner, .callout.tie { background: var(--accent); color: #1a0b3d; }
    @keyframes slam { from { transform: translateX(60vw) skewX(-20deg); } 70% { transform: translateX(-2vw) skewX(5deg); } to { transform: none; } }
    @keyframes stamp { from { transform: scale(3) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(-6deg); opacity: 1; } to { transform: scale(1) rotate(-6deg); } }
    @keyframes fade-out { to { opacity: 0; transform: translateY(-3vh); } }
    @keyframes flicker { from { transform: scale(1) rotate(-5deg); } to { transform: scale(1.15) rotate(5deg); } }

    /* Full-screen title card that sweeps in before each question. */
    .card-sweep { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; z-index: 8; pointer-events: none; background: linear-gradient(115deg, var(--c0) 0 50%, var(--c1) 50% 100%); animation: sweep 1.6s cubic-bezier(.7,0,.3,1) forwards; }
    .card-sweep .big { font-family: "Bungee", sans-serif; font-size: 16vh; line-height: 1; text-shadow: 0 1.2vh 0 rgba(0,0,0,.3); }
    .card-sweep .small { font-size: 5vh; letter-spacing: .25em; text-transform: uppercase; }
    .card-sweep.final-q { background: linear-gradient(115deg, #ff3d00 0 50%, #1a0b3d 50% 100%); }
    @keyframes sweep { 0% { clip-path: polygon(0 0, 0 0, -20% 100%, -20% 100%); } 25%, 75% { clip-path: polygon(0 0, 120% 0, 100% 100%, -20% 100%); } 100% { clip-path: polygon(120% 0, 120% 0, 100% 100%, 100% 100%); } }

    /* Question and reveal motion. */
    .enter .prompt { animation: rise .6s .9s cubic-bezier(.2,1.2,.4,1) both; }
    .enter .choice { animation: pop-in .4s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(1.2s + var(--i) * 120ms); }
    @keyframes rise { from { transform: translateY(6vh); opacity: 0; } to { transform: none; opacity: 1; } }
    .hurry .secs { color: var(--bad); animation: throb .5s ease-in-out infinite alternate; }
    .hurry .timer-fill { background: var(--bad); }
    @keyframes throb { to { transform: scale(1.35); } }
    #reveal.enter .choice.dim { animation: shake .45s ease-in-out both; }
    #reveal.enter .choice.right { animation: glow 1.2s ease-in-out .2s 2 alternate; }
    @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-1.2vw); } 75% { transform: translateX(1.2vw); } }
    @keyframes glow { from { box-shadow: 0 0 0 rgba(46,229,157,0); } to { box-shadow: 0 0 6vh rgba(46,229,157,.9); transform: scale(1.06); } }
    .float-pts { position: absolute; top: -3vh; right: 1vw; font-family: "Bungee", sans-serif; color: var(--good); font-size: 3.5vh; animation: float-up 1.8s ease-out .6s both; }
    @keyframes float-up { from { transform: translateY(2vh); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-5vh); opacity: 0; } }

    /* Intro: logo slam, spotlights, contestants fly in. */
    #intro { align-items: center; justify-content: center; gap: 5vh; overflow: hidden; }
    #intro .logo { font-family: "Bungee", sans-serif; font-size: 18vh; color: var(--accent); text-shadow: 0 1.5vh 0 rgba(0,0,0,.35); animation: logo-slam .9s cubic-bezier(.2,1.6,.4,1) both; z-index: 1; }
    #intro .tagline { font-size: 3.4vh; color: var(--muted); letter-spacing: .3em; text-transform: uppercase; animation: rise .6s .7s both; z-index: 1; }
    #intro .lineup { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; max-width: 85vw; z-index: 1; }
    #intro .lineup > div { display: flex; flex-direction: column; align-items: center; gap: 1vh; font-size: 2.8vh; animation: fly-in .6s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(1s + var(--i) * 150ms); }
    .spot { position: absolute; top: -20vh; width: 30vw; height: 140vh; background: linear-gradient(rgba(255,255,255,.18), transparent 80%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); transform-origin: top center; animation: swing 4s ease-in-out infinite alternate; }
    .spot.l { left: 5vw; } .spot.r { right: 5vw; animation-delay: -2s; }
    @keyframes logo-slam { from { transform: scale(4) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fly-in { from { transform: translateY(40vh) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes swing { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }

    /* Scoreboard rows slide from their old place to their new one. */
    .board .row { transition: transform .9s cubic-bezier(.2,1,.3,1); }
    .row.up { box-shadow: 0 0 0 .4vh var(--good); }
    .row.down { opacity: .85; }
    .crown { position: absolute; top: -6vh; left: 50%; transform: translateX(-50%); font-size: 7vh; animation: logo-slam .8s 1s both; }
    .step { position: relative; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }

    .toast { position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%); background: var(--bad); padding: 1.2vh 2vw; border-radius: 2vh; font-size: 2.6vh; z-index: 10; }
  </style>
</head>
<body>
  <div id="offline" class="banner hidden">Reconnecting to the server…</div>
  <div id="toast" class="toast hidden"></div>

  <section id="setup" class="screen hidden" data-screen>
    <h1>TriviaBix</h1>
    <p class="muted">Put this on the TV. Everyone else grabs their phone.</p>
    <div class="opts">
      <span>Questions</span>
      <button class="secondary" data-rounds="5">5</button>
      <button class="secondary" data-rounds="10">10</button>
      <button class="secondary" data-rounds="15">15</button>
    </div>
    <div class="opts">
      <span>Rated</span>
      <button class="secondary" data-rating="PG">PG</button>
      <button class="secondary" data-rating="PG-13">PG-13</button>
      <button class="secondary" data-rating="MA">MA</button>
      <button class="secondary" data-rating="NC-17">NC-17</button>
    </div>
    <button id="create" autofocus>Start a room</button>
    <p class="error" id="setup-error"></p>
  </section>

  <section id="lobby" class="screen hidden" data-screen>
    <div class="topbar"><span class="display">TriviaBix</span><span id="lobby-settings"></span></div>
    <div class="main">
      <div class="join-card">
        <div class="url">Join at <b id="join-url"></b></div>
        <div class="code" id="room-code">----</div>
        <img id="qr" alt="QR code to join">
      </div>
      <div>
        <div class="slots" id="slots"></div>
      </div>
    </div>
    <div class="lobby-foot">
      <span id="lobby-hint"></span>
      <button id="start-btn" disabled>Start (Enter)</button>
    </div>
  </section>

  <section id="intro" class="screen hidden" data-screen>
    <div class="spot l"></div><div class="spot r"></div>
    <div class="logo">TriviaBix</div>
    <div class="tagline" id="i-tagline"></div>
    <div class="lineup" id="i-lineup"></div>
  </section>

  <section id="question" class="screen hidden" data-screen>
    <div class="topbar"><span id="q-round"></span><span class="secs" id="q-secs"></span><span class="code-chip" id="q-code"></span></div>
    <div class="cat" id="q-cat"></div>
    <div class="prompt" id="q-prompt"></div>
    <div class="choices" id="q-choices"></div>
    <div class="timer"><div class="timer-track"><div class="timer-fill" id="q-timer"></div></div></div>
    <div class="answered-row" id="q-answered"></div>
  </section>

  <section id="reveal" class="screen hidden" data-screen>
    <div class="topbar"><span id="r-round"></span><span></span><span class="code-chip" id="r-code"></span></div>
    <div class="cat" id="r-cat"></div>
    <div class="prompt" id="r-prompt"></div>
    <div class="choices" id="r-choices"></div>
    <div class="timer"><div class="timer-track"><div class="timer-fill" id="r-timer"></div></div></div>
  </section>

  <section id="scoreboard" class="screen hidden" data-screen>
    <div class="topbar"><span id="s-round"></span><span></span><span class="code-chip" id="s-code"></span></div>
    <h2>Scores</h2>
    <div class="board" id="s-board"></div>
  </section>

  <section id="final" class="screen hidden" data-screen>
    <h2 id="f-title">Winner!</h2>
    <div class="podium" id="f-podium"></div>
    <div class="rest" id="f-rest"></div>
    <div class="lobby-foot" style="margin-top:3vh">
      <span class="muted">The VIP can start a rematch from their phone.</span>
      <button id="again-btn">Play again (Enter)</button>
    </div>
  </section>

  <div class="host-bar quiet" id="host-bar">
    <div class="host-face" id="host-face" data-name="Bix">🎤</div>
    <div class="host-bubble" id="host-bubble"></div>
  </div>
  <div class="callouts" id="callouts"></div>
  <canvas id="confetti"></canvas>

  <div class="corner">
    <button class="secondary" id="mute-btn" title="M">🔊 Host voice</button>
    <button class="secondary" id="voice-btn" title="V">🗣 Voice</button>
    <button class="secondary" id="fs-btn" title="F">⛶ Fullscreen</button>
    <button class="secondary hidden" id="skip-btn" title="Space">Skip ⏭</button>
  </div>

  <script src="/common.js"></script>
  <script src="/host.js"></script>
</body>
</html>

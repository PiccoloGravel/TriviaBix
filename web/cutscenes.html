<!doctype html>
<html lang="en" data-look="after-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriviaBix · Cutscenes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/after-dark.css">
  <link rel="stylesheet" href="/bix.css">
  <link rel="stylesheet" href="/cutscenes.css">
  <style>
    body { padding: 3vh 4vw; font-size: 2.2vh; }
    h1 { margin: 0 0 1vh; color: var(--accent); }
    h2 { margin: 4vh 0 1.5vh; font-size: 3vh; }
    .moods { display: flex; flex-wrap: wrap; gap: 2vw; }
    .mood { width: 14vh; text-align: center; color: var(--muted); cursor: pointer; }
    .cues { display: grid; grid-template-columns: repeat(auto-fill, minmax(26vh, 1fr)); gap: 1.5vh; }
    .cues button { text-align: left; display: flex; flex-direction: column; gap: .3vh; font-size: 2.2vh; }
    .cues small { font-weight: 700; opacity: .8; }
    .opts { display: flex; gap: 1vw; align-items: center; flex-wrap: wrap; }
    .scenes { display: flex; flex-wrap: wrap; gap: 1vh; }
    .art { display: grid; grid-template-columns: repeat(auto-fill, minmax(22vh, 1fr)); gap: 1.5vh; }
    .art figure { margin: 0; background: rgba(255,255,255,.06); border-radius: 1.2vh; padding: 1vh; font-size: 1.6vh; }
    .art img, .art video { width: 100%; height: 14vh; object-fit: contain; display: block; background: repeating-conic-gradient(#2a1f45 0 25%, #1f1636 0 50%) 0 0 / 2vh 2vh; border-radius: .8vh; }
    .art figcaption { margin-top: .6vh; }
    .art .tags { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Cutscenes</h1>
  <p class="muted">Every cue the server sends, and the scene and face it gets. Click one to play it with made-up players.
    Scenes live in <code>web/cutscenes/</code>; reload this page after editing one. Press Enter or click to end a scene early.</p>
  <div class="opts">
    <span>Players</span>
    <button class="secondary" data-n="2">2</button>
    <button class="secondary" data-n="6">6</button>
    <button class="secondary" data-n="12">12</button>
    <label><input type="checkbox" id="sound" checked> Sound effects</label>
    <label>Room rating <select id="rating"><option>PG</option><option>PG-13</option><option>MA</option><option selected>NC-17</option></select></label>
    <label>Category <select id="category"></select></label>
  </div>

  <h2>Bix's moods</h2>
  <div class="moods" id="moods"></div>

  <h2>Cues</h2>
  <div class="cues" id="cues"></div>

  <h2>Every scene</h2>
  <div class="scenes" id="scenes"></div>

  <h2>Generated art</h2>
  <p class="muted" id="art-note"></p>
  <div class="art" id="art"></div>

  <script src="/common.js"></script>
  <script src="/bix.js"></script>
  <script src="/cutscenes.js"></script>
  <script>
    const NAMES = ["Jess", "Big Mike", "Priya", "Tomás", "Rory", "Danielle", "Kofi", "Mei", "Sasha", "Ollie", "Bea", "Zed"];
    const COLORS = ["#e63973", "#2f80ed", "#f2a900", "#27ae60", "#7b5cff", "#ff6b35", "#00b8a9", "#c06c84", "#3fa9f5", "#ff4f81", "#8bc34a", "#9c27b0"];
    let count = 6;

    function players() {
      return NAMES.slice(0, count).map((name, i) => ({
        id: i + 1, name, color: COLORS[i], score: (count - i) * 850,
        character: (TBX.characterList[i] || {}).id,
      }));
    }

    function context(cue) {
      const ps = players();
      const subject = cue === "last_place" ? ps[ps.length - 1] : ps[Math.min(1, ps.length - 1)];
      return {
        players: cue === "finale_tie" ? ps.slice(0, 2) : ps,
        subject,
        rating: $("#rating").value,
        vars: { host: "Bix", round: 4, total: 10, kind: "Question", category: $("#category").value || "Movies", name: subject.name,
          score: subject.score.toLocaleString(), label: { streak: "4 IN A ROW", winner: "CHAMPION", new_leader: "NEW LEADER" }[cue] || "" },
      };
    }

    function renderCues() {
      const cues = Cutscenes.manifest.cues;
      $("#cues").replaceChildren(...Object.entries(cues).map(([cue, c]) => {
        const scenes = c.scenes || [];
        const b = TBX.el("button", { class: scenes.length ? "" : "secondary" },
          TBX.el("span", {}, cue),
          TBX.el("small", {}, `${scenes.length ? scenes.join(", ") : "no scene"} · Bix ${c.mood || "happy"}` +
            (c.chance != null && c.chance < 1 ? ` · ${Math.round(c.chance * 100)}% of the time` : "")));
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          if (scenes.length) Cutscenes.play(scenes[Math.floor(Math.random() * scenes.length)], context(cue));
        });
        return b;
      }));
    }

    const { $ } = TBX;
    document.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => {
      count = Number(b.dataset.n);
      document.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("secondary", x !== b));
    }));
    document.querySelector('[data-n="6"]').classList.remove("secondary");
    $("#sound").addEventListener("change", (e) => { Cutscenes.sound = e.target.checked; });
    document.addEventListener("click", () => Cutscenes.stop());
    document.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") Cutscenes.stop(); });

    $("#moods").replaceChildren(...Bix.MOODS.map((m) => {
      const box = TBX.el("div", { class: "mood" });
      const face = Bix.create(m);
      box.append(face, TBX.el("div", {}, m));
      // Click a face to see it talk.
      box.addEventListener("click", (e) => { e.stopPropagation(); box.classList.toggle("talking"); });
      return box;
    }));

    /** Every scene file on its own, so a cue with several can be checked one by one. */
    function renderScenes() {
      const cueOf = {};
      for (const [cue, c] of Object.entries(Cutscenes.manifest.cues)) for (const n of c.scenes || []) cueOf[n] = cueOf[n] || cue;
      $("#scenes").replaceChildren(...Object.keys(Cutscenes.scenes).sort().map((name) => {
        const b = TBX.el("button", { class: "secondary" }, name);
        b.addEventListener("click", (e) => { e.stopPropagation(); Cutscenes.play(name, context(cueOf[name])); });
        return b;
      }));
    }

    /** What art/generate.py has made, with the tags scenes find it by. */
    function renderArt() {
      const files = Cutscenes.art.files;
      const paths = Object.keys(files).sort();
      $("#art-note").textContent = paths.length
        ? `${paths.length} files, ${(paths.reduce((n, p) => n + (files[p].bytes || 0), 0) / 1e6).toFixed(1)} MB. Scenes pick these by kind and tag; see web/cutscenes/README.md.`
        : "None yet. Scenes use their drawn backdrops and emoji until art/generate.py makes some (see art/README.md).";
      $("#art").replaceChildren(...paths.map((p) => {
        const f = files[p];
        const src = Cutscenes.base + "assets/gen/" + p;
        const media = p.endsWith(".mp4") ? TBX.el("video", { src, muted: "", loop: "", autoplay: "", playsinline: "" }) : TBX.el("img", { src, alt: "" });
        return TBX.el("figure", { title: f.prompt || "" }, media,
          TBX.el("figcaption", {}, TBX.el("b", {}, `${f.kind}: ${f.id}`), ` · ${f.rating || "PG"} · ${Math.round((f.bytes || 0) / 1000)} KB`,
            TBX.el("div", { class: "tags" }, (f.tags || []).join(", "))));
      }));
      const cats = [...new Set(["Movies", ...Object.keys(Cutscenes.art.categories)])];
      $("#category").replaceChildren(...cats.map((c) => TBX.el("option", {}, c)));
    }

    (async () => {
      await Promise.all([TBX.loadCharacters(), Cutscenes.load()]);
      renderCues();
      renderScenes();
      renderArt();
    })();
  </script>
</body>
</html>

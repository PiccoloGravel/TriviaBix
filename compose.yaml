services:
  triviabix:
    # `docker compose up --build` builds from source. To use the published image instead
    # (what Unraid does), run `docker compose pull && docker compose up`.
    image: ghcr.io/piccologravel/triviabix:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      # The address phones should open, e.g. http://192.168.1.20:8080.
      # Leave empty to use whatever address the TV page was opened on.
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-12}
      # Turns on the admin panel at /admin.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: your music library through Lidarr. Mount the music folder below too.
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      LIDARR_MUSIC_PATH: ${LIDARR_MUSIC_PATH:-}
    volumes:
      - triviabix-data:/data
      # The folder Lidarr keeps your music in, read-only.
      # - /path/to/music:/music:ro
    restart: unless-stopped

volumes:
  triviabix-data:

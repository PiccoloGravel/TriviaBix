services:
  triviabix:
    # `docker compose up --build` builds from source. To use the published image instead
    # (what Unraid does), run `docker compose pull && docker compose up`.
    image: ghcr.io/piccologravel/triviabix:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      # The address phones should open, e.g. http://192.168.1.20:8080.
      # Leave empty to use whatever address the TV page was opened on.
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-12}
      # Turns on the admin panel at /admin.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Bix's voice. Set to http://tts:8000 and start with --profile voice (see tts/README.md).
      # Empty means the TV uses the browser's text-to-speech.
      TTS_URL: ${TTS_URL:-}
    volumes:
      - triviabix-data:/data
    restart: unless-stopped

  # Ming-3.0-tts for Bix's voice. Needs an NVIDIA GPU and the NVIDIA container toolkit.
  #   TTS_URL=http://tts:8000 docker compose --profile voice up --build
  tts:
    image: ghcr.io/piccologravel/triviabix-tts:latest
    build: ./tts
    profiles: [voice]
    ports:
      - "8000:8000"
    environment:
      # ip:US_James, ip:US_Emma, ip:UK_George, ip:UK_Charlotte, or clone:/voices/bix.wav
      BIX_VOICE: ${BIX_VOICE:-ip:US_James}
    volumes:
      - tts-models:/models
      - ./voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  triviabix-data:
  tts-models:

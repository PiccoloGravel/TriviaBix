# TriviaBix for Unraid with the Docker Compose Manager plugin.
# Paste this into a new stack, then set the values in the stack's .env file (see .env.example).
# The Community Applications template (triviabix.xml) is the alternative if you'd rather not use
# compose.

services:
  triviabix:
    image: ghcr.io/piccologravel/triviabix:latest
    container_name: triviabix
    ports:
      - "${TRIVIABIX_PORT:-8080}:8080"
    environment:
      # The address phones open and the TV's QR code shows, e.g. http://192.168.1.20:8080.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Turns on the admin panel at /admin. Leave empty to keep it off.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-12}
      # Keep question packs in appdata so you can add your own.
      CONTENT_DIR: /data/content
      # nobody:users, Unraid's usual appdata owner.
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/New_York}
      # Your music library through Lidarr (optional). See deploy/unraid/README.md.
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      # The music folder as Lidarr sees it; empty uses Lidarr's root folder.
      LIDARR_MUSIC_PATH: ${LIDARR_MUSIC_PATH:-}
      LIBRARY_RATING: ${LIBRARY_RATING:-PG-13}
    volumes:
      # triviabix.db (players, scores, admin edits) and content/ (question packs, host scripts).
      - /mnt/user/appdata/triviabix:/data
      # The music share Lidarr manages, read-only. The TV streams clips from it.
      - ${MUSIC_SHARE:-/mnt/user/data/media/music}:/music:ro
    restart: unless-stopped

  # Bix's self-hosted voice (optional). It needs an NVIDIA GPU (Nvidia Driver plugin on Unraid)
  # and comes with the TTS work in tts/. Once that lands, uncomment this, add
  # TTS_URL: http://tts:8000 to triviabix's environment above, and run with the "voice" profile.
  # Spoken lines are cached under /data/tts in triviabix's appdata.
  #
  # tts:
  #   image: ghcr.io/piccologravel/triviabix-tts:latest
  #   profiles: [voice]
  #   runtime: nvidia
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #   volumes:
  #     - /mnt/user/appdata/triviabix-tts:/models
  #   restart: unless-stopped

# TriviaBix for Unraid with the Docker Compose Manager plugin.
# Paste this into a new stack, then set the values in the stack's .env file (see .env.example).
# The Community Applications template (triviabix.xml) is the alternative if you'd rather not use
# compose.

services:
  triviabix:
    image: ghcr.io/piccologravel/triviabix:latest
    container_name: triviabix
    ports:
      - "${TRIVIABIX_PORT:-8080}:8080"
    environment:
      # The address phones open and the TV's QR code shows at home, e.g. http://192.168.1.20:8080.
      # A TV that opened the game on its https address (playing away, see REMOTE.md) shows that
      # address instead, so keep this the LAN one.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Turns on the admin panel at /admin. Leave empty to keep it off.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-12}
      # Keep question packs in appdata so you can add your own.
      CONTENT_DIR: /data/content
      # nobody:users, Unraid's usual appdata owner.
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/New_York}
      # Your music library through Lidarr (optional). See deploy/unraid/README.md.
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      # The music folder as Lidarr sees it; empty uses Lidarr's root folder.
      LIDARR_MUSIC_PATH: ${LIDARR_MUSIC_PATH:-}
      LIBRARY_RATING: ${LIBRARY_RATING:-PG-13}
      # Bix's voice server: http://tts:8000 with the voice profile, empty for the browser's voice.
      TTS_URL: ${TTS_URL:-}
      # Rendering from the admin panel (optional): GPUs on vast.ai for voice and art, and Claude
      # for host lines. Never shown in the panel; leave empty to turn that job off.
      VAST_API_KEY: ${VAST_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # A read:packages token so rented GPUs can pull the private ghcr.io images.
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # triviabix.db (players, scores, admin edits) and content/ (question packs, host scripts).
      - /mnt/user/appdata/triviabix:/data
      # The music share Lidarr manages, read-only. The TV streams clips from it.
      - ${MUSIC_SHARE:-/mnt/user/data/media/music}:/music:ro
    restart: unless-stopped

  # Bix's self-hosted voice (optional). Needs an NVIDIA GPU and the Nvidia Driver plugin. Start the
  # stack with the "voice" profile and set TTS_URL=http://tts:8000 in .env (see deploy/unraid/README.md).
  # Spoken lines are kept under /data/assets/voice in triviabix's appdata.
  tts:
    image: ghcr.io/piccologravel/triviabix-tts:latest
    container_name: triviabix-tts
    profiles: [voice]
    runtime: nvidia
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # ip:US_James, ip:US_Emma, ip:UK_George, ip:UK_Charlotte, or clone:/voices/bix.wav
      BIX_VOICE: ${BIX_VOICE:-ip:US_James}
    volumes:
      # The model (about 3 GB) downloads here on first start.
      - /mnt/user/appdata/triviabix-tts/models:/models
      # Reference clips for a custom Bix voice (bix.wav + bix.txt).
      - /mnt/user/appdata/triviabix-tts/voices:/voices
    restart: unless-stopped

  # Playing away from home with Tailscale Funnel (deploy/unraid/REMOTE.md): a public
  # https://triviabix.<your tailnet>.ts.net address, free, with no ports opened on the router.
  # Start the stack with the "funnel" profile, with TS_AUTHKEY in .env and serve.json from this
  # folder copied to /mnt/user/appdata/triviabix-tailscale/.
  funnel:
    image: tailscale/tailscale:stable
    container_name: triviabix-funnel
    profiles: [funnel]
    hostname: ${TS_HOSTNAME:-triviabix}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-triviabix}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /var/lib/tailscale/serve.json
      # No /dev/net/tun needed: Funnel only forwards web traffic to the game.
      TS_USERSPACE: "true"
    volumes:
      # The node's login (so the auth key is used once) and serve.json.
      - /mnt/user/appdata/triviabix-tailscale:/var/lib/tailscale
    depends_on: [triviabix]
    restart: unless-stopped

  # Playing away from home with Cloudflare Tunnel (deploy/unraid/REMOTE.md): your own domain,
  # e.g. https://trivia.example.com. Start the stack with the "tunnel" profile, with the tunnel's
  # token in .env as CLOUDFLARE_TUNNEL_TOKEN, and point the tunnel's public hostname at
  # http://triviabix:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: triviabix-tunnel
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [triviabix]
    restart: unless-stopped
